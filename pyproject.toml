[project]
name = "stock-picker"
version = "0.1.0"
description = "Explainable, rules-based stock screener (India NSE + US large caps)"
requires-python = ">=3.11"
dependencies = [
    "yfinance",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pandas",
    "scikit-learn",   # ML model + walk-forward evaluation
    "joblib",
    "scipy",
    "pysentiment2",  # Loughran-McDonald finance dictionary (offline sentiment scorer)
    "exchange_calendars",  # NYSE holidays + half-days (US profile: market phase, T+1 settlement)
    "httpx",              # app/gateway.py forwards each request to the India or US worker
]

[project.optional-dependencies]
# FinBERT news sentiment (optional upgrade). Needs the weights on disk: set FINBERT_PATH or place them in the
# Hugging Face cache; the app never downloads at runtime. Without them it uses Loughran-McDonald (and says so).
finbert = ["torch", "transformers"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
